server {
    # 监听 80 端口，根据实际需求更改端口
    listen 80;
    listen [::]:80;

    # 您的网站根目录
    root /var/www/html; 
    
    # 默认首页添加 index.php
    index mytv.php index.php index.html index.htm;

    # 替换为您的域名，或者保留 _ 表示允许通过 IP 或任意域名访问
    server_name _; 

    location / {
        try_files $uri $uri/ =404;
    }

    # 核心：PHP 解析配置块
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        # 请务必将下面的 php8.4-fpm.sock 改为您第2步看到的实际文件名
        fastcgi_pass unix:/run/php/php8.4-fpm.sock; 
    }

    # 安全配置：隐藏 Apache/htaccess 配置文件
    location ~ /\.ht {
        deny all;
    }
}

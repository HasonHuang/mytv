# Debian / Ubuntu 专用站点配置 → /etc/nginx/conf.d/php-site.conf
#
# 本文件不含 PHP-FPM 地址（它随 PHP 版本变化）：install.sh 探测后写入
# /etc/nginx/mytv-fpm.conf，这里只 include 它。手动部署请自行创建该文件
# （内容为一行 fastcgi_pass），或改用同目录内联好地址的 php-site-manual.conf。
#
# 小内存机（64/128MB）请先收紧 PHP-FPM：mytv.php 会把整个 .ts 分片读进内存，
# 而默认 memory_limit=128M × pm.max_children=5 远超物理内存。详见 README。

# 可选限流，按需取消注释（本文件在 http 块内，可写 http 级指令）。zone 用 1m
# 够用（约 1.6 万个 IP），10m 在小内存机上白占 20MB；limit_conn 不要大于
# php-fpm 的 pm.max_children，否则形同虚设。
# limit_req_zone $binary_remote_addr zone=mytvreq:1m rate=20r/s;
# limit_conn_zone $binary_remote_addr zone=mytvconn:1m;

server {
    listen 80;                  # 按实际需求更改端口
    listen [::]:80;
    root /var/www/html;         # 您的网站根目录
    index mytv.php index.php index.html index.htm;
    server_name _;              # 换成您的域名，或保留 _ 允许用 IP / 任意域名访问

    # mytv.php 整段缓冲后才回传，大分片可能超过默认的 60s，故放大。三条都只限制
    # 两次 IO 之间的空闲，不是总时长上限；不要关 fastcgi_buffering，本就是整段
    # 缓冲，关掉只会让 php-fpm 的 worker 被慢速客户端占满整个下载过程。
    # 小内存机反而应调小：超时 = 一个 worker 被占用多久，pm.max_children 只有
    # 1~2 时上游卡住 120s 就是整站 2 分钟不可用。
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 120s;
    send_timeout 120s;

    # 不能超过 PHP 的 post_max_size（默认 8M），否则 PHP 静默丢弃请求体，
    # php://input 变空串，上游收到一个空 body 的 POST。
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    # ⚠️ 下面两条必须排在 location ~ \.php$ 之前：正则 location 按出现顺序取
    # 第一个匹配，放到后面的话 /.config.php 会被交给 PHP-FPM 执行而非拒绝。

    # 隐藏文件（.git/.env/.htpasswd 及下载中间文件）禁止下载；放行 /.well-known
    # 以免影响 certbot 之类的证书校验。
    location ~ /\.(?!well-known) {
        deny all;
    }

    # 编辑器/备份残留（mytv.php~、.bak、.bak.20260921、.1、.swp 等）禁止下载：
    # 它们不以 .php 结尾，会被当静态文件下载出去泄露源码。别往列表里加 ts。
    location ~* (\~|\.[0-9]+|\.(bak|old|orig|save|swp|swo|tmp|log|phps)([._-]?[0-9]+)?)$ {
        deny all;
    }

    location ~ \.php$ {         # 核心：PHP 解析配置块
        # Debian/Ubuntu 的 nginx 包自带该片段，内含 try_files 保护与 fastcgi_param
        include snippets/fastcgi-php.conf;
        include /etc/nginx/mytv-fpm.conf;   # 由 install.sh 生成

        # 服务暴露在公网时建议启用访问控制（按需取消注释）：
        # allow 192.168.0.0/16;
        # allow 127.0.0.1;
        # deny all;

        # 可选限流（需同时取消文件开头两行 zone 定义的注释）：
        # limit_req zone=mytvreq burst=40 nodelay;
        # limit_conn mytvconn 2;
    }
}
